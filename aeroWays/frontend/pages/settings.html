<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaBank - Settings</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/settings.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-cyan-400 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-500/30">
          N
        </div>
        <span class="text-xl font-bold tracking-tight text-white">Nova<span class="text-indigo-400">Bank</span></span>
      </div>

      <nav class="hidden md:flex items-center space-x-1">
        <a href="index.html" class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition">Auth</a>
        <a href="accounts.html" class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition">Accounts</a>
        <a href="transactions.html" class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition">Transactions</a>
        <a href="cards.html" class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition">Cards</a>
        <a href="settings.html" class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-white bg-indigo-600/20 border border-indigo-500/30">Settings</a>
      </nav>

      <div class="flex items-center space-x-3">
        <div class="text-right hidden sm:block">
          <p id="profile-name" class="text-sm font-medium text-slate-200">Alex Morgan</p>
          <p class="text-xs text-emerald-400 flex items-center justify-end gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Active Session
          </p>
        </div>
        <div class="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 font-semibold text-sm">
          AM
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <h1 class="text-2xl font-bold text-white mb-6">Security & Preferences</h1>

    <form id="settings-form" class="space-y-6 bg-slate-900/60 border border-slate-800 p-6 rounded-2xl backdrop-blur-md">
      <div class="space-y-4">
        <h2 class="text-lg font-semibold text-indigo-400">Security Settings</h2>
        <div class="flex items-center justify-between py-3 border-b border-slate-800">
          <div>
            <p class="text-sm font-medium text-white">Two-Factor Authentication (2FA)</p>
            <p class="text-xs text-slate-400">Require an extra verification step during sign in.</p>
          </div>
          <input type="checkbox" id="2fa-toggle" class="w-5 h-5 accent-indigo-600 rounded cursor-pointer" checked>
        </div>

        <div class="flex items-center justify-between py-3 border-b border-slate-800">
          <div>
            <p class="text-sm font-medium text-white">Email Notifications</p>
            <p class="text-xs text-slate-400">Receive alerts for transfers and security changes.</p>
          </div>
          <input type="checkbox" id="email-notif" class="w-5 h-5 accent-indigo-600 rounded cursor-pointer" checked>
        </div>
      </div>

      <div class="pt-4 flex justify-end">
        <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl text-sm transition">
          Save Changes
        </button>
      </div>
    </form>
  </main>

  <script src="scripts/common.js"></script>
  <script src="scripts/settings.js"></script>
</body>
</html>
