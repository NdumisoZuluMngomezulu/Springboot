<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaBank - Accounts</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/accounts.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-cyan-400 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-500/30">
          N
        </div>
        <span class="text-xl font-bold tracking-tight text-white">Nova<span class="text-indigo-400">Bank</span></span>
      </div>

      <nav class="hidden md:flex items-center space-x-1">
        <a href="index.html" class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition">Auth</a>
        <a href="accounts.html" class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-white bg-indigo-600/20 border border-indigo-500/30">Accounts</a>
        <a href="transactions.html" class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition">Transactions</a>
        <a href="cards.html" class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition">Cards</a>
        <a href="settings.html" class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition">Settings</a>
      </nav>

      <div class="flex items-center space-x-3">
        <div class="text-right hidden sm:block">
          <p id="profile-name" class="text-sm font-medium text-slate-200">Alex Morgan</p>
          <p class="text-xs text-emerald-400 flex items-center justify-end gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Active Session
          </p>
        </div>
        <div class="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 font-semibold text-sm">
          AM
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-2xl font-bold text-white">Accounts Overview</h1>
        <p class="text-sm text-slate-400">Manage your active checking, savings, and investment accounts.</p>
      </div>
      <button class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium shadow-md transition flex items-center gap-2">
        <i class="fa-solid fa-plus text-xs"></i> Open New Account
      </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="accounts-container">
      <!-- Injected by accounts.js -->
    </div>
  </main>

  <script src="scripts/common.js"></script>
  <script src="scripts/accounts.js"></script>
</body>
</html>
