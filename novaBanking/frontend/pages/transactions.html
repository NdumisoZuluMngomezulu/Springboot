<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaBank - Transactions</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/transactions.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-cyan-400 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-500/30">
          N
        </div>
        <span class="text-xl font-bold tracking-tight text-white">Nova<span class="text-indigo-400">Bank</span></span>
      </div>

      <nav class="hidden md:flex items-center space-x-1">
        <a href="index.html" class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition">Auth</a>
        <a href="accounts.html" class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition">Accounts</a>
        <a href="transactions.html" class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-white bg-indigo-600/20 border border-indigo-500/30">Transactions</a>
        <a href="cards.html" class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition">Cards</a>
        <a href="settings.html" class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition">Settings</a>
      </nav>

      <div class="flex items-center space-x-3">
        <div class="text-right hidden sm:block">
          <p id="profile-name" class="text-sm font-medium text-slate-200">Alex Morgan</p>
          <p class="text-xs text-emerald-400 flex items-center justify-end gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Active Session
          </p>
        </div>
        <div class="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 font-semibold text-sm">
          AM
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-white">Recent Activity</h1>
      <input type="text" id="tx-search" placeholder="Search transactions..." class="bg-slate-900 border border-slate-800 text-slate-200 px-4 py-2 rounded-xl text-sm focus:outline-none focus:border-indigo-500 w-64">
    </div>

    <div class="bg-slate-900/60 border border-slate-800 rounded-2xl overflow-hidden backdrop-blur-md">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="border-b border-slate-800 text-xs font-semibold text-slate-400 uppercase tracking-wider bg-slate-950/40">
            <th class="p-4">Transaction</th>
            <th class="p-4">Category</th>
            <th class="p-4">Date</th>
            <th class="p-4 text-right">Amount</th>
          </tr>
        </thead>
        <tbody id="tx-table-body" class="divide-y divide-slate-800/50 text-sm">
          <!-- Injected by transactions.js -->
        </tbody>
      </table>
    </div>
  </main>

  <script src="scripts/common.js"></script>
  <script src="scripts/transactions.js"></script>
</body>
</html>
