<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaBank - Secure Portal</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Smooth Animation Utilities */
    .form-transition {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    /* Radial Glow Effects */
    .bg-glow {
      background: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15) 0%, rgba(15, 23, 42, 0) 70%);
    }

    /* Glassmorphism Card Effect */
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Custom Spinner */
    .spinner {
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="h-full font-sans antialiased bg-slate-950 flex flex-col justify-between overflow-x-hidden bg-glow min-h-screen">

  <!-- Background Decorative Shapes -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 -right-40 w-96 h-96 bg-purple-600/15 rounded-full blur-3xl"></div>
  </div>

  <!-- Main Container -->
  <main class="relative z-10 flex-grow flex items-center justify-center p-4 sm:p-6 lg:p-8">
    <div class="w-full max-w-md">
      
      <!-- Brand Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 mb-4 shadow-lg shadow-indigo-500/10">
          <i class="fa-solid me-0 fa-shield-halved text-2xl"></i>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">NovaBank Auth</h1>
        <p class="text-sm text-slate-400 mt-1">Access your digital asset dashboard</p>
      </div>

      <!-- Auth Card -->
      <div class="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl">
        
        <!-- Tab Switcher -->
        <div class="relative p-1 bg-slate-900/80 rounded-xl border border-slate-800 mb-6 flex items-center">
          <!-- Active Tab Indicator Slide -->
          <div id="tab-indicator" class="absolute top-1 bottom-1 left-1 w-[calc(50%-4px)] bg-indigo-600 rounded-lg transition-transform duration-300 ease-in-out shadow-md"></div>
          
          <button id="btn-login" onclick="setAuthMode('login')" class="relative z-10 w-1/2 py-2.5 text-sm font-semibold rounded-lg text-white transition-colors duration-200">
            Sign In
          </button>
          <button id="btn-register" onclick="setAuthMode('register')" class="relative z-10 w-1/2 py-2.5 text-sm font-semibold rounded-lg text-slate-400 transition-colors duration-200">
            Register
          </button>
        </div>

        <!-- Alert Notification Box -->
        <div id="auth-message" class="hidden mb-6 p-4 rounded-xl text-sm font-medium border flex items-start gap-3 transition-all duration-300">
          <i id="auth-message-icon" class="fa-solid fa-circle-info text-base mt-0.5 shrink-0"></i>
          <span id="auth-message-text" class="flex-grow"></span>
        </div>

        <!-- Auth Form -->
        <form id="auth-form" onsubmit="handleFormSubmit(event)" novalidate class="space-y-4">
          
          <!-- Full Name Field (Register Mode Only) -->
          <div id="name-field" class="hidden space-y-1.5 transition-all duration-300">
            <label for="fullName" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Full Name</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                <i class="fa-regular fa-user"></i>
              </div>
              <input type="text" id="fullName" placeholder="Jane Doe" class="w-full pl-10 pr-4 py-3 bg-slate-900/90 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
            </div>
          </div>

          <!-- Email Field -->
          <div class="space-y-1.5">
            <label for="email" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Email Address</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                <i class="fa-regular fa-envelope"></i>
              </div>
              <input type="email" id="email" required placeholder="name@example.com" class="w-full pl-10 pr-4 py-3 bg-slate-900/90 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
            </div>
          </div>

          <!-- Password Field -->
          <div class="space-y-1.5">
            <div class="flex items-center justify-between">
              <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Password</label>
              <a href="#" id="forgot-password" onclick="triggerForgotPassword(event)" class="text-xs text-indigo-400 hover:text-indigo-300 transition-colors">Forgot password?</a>
            </div>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                <i class="fa-solid fa-lock text-xs"></i>
              </div>
              <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" class="w-full pl-10 pr-10 py-3 bg-slate-900/90 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
              
              <!-- Toggle Password Visibility Button -->
              <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 transition-colors">
                <i id="password-toggle-icon" class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

          <!-- Extra Options: Remember Me / Terms -->
          <div class="flex items-center justify-between pt-1">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" id="remember-me" class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-900">
              <span id="remember-text" class="text-xs text-slate-400">Remember session</span>
            </label>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="auth-submit" class="w-full mt-4 py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white text-sm font-semibold rounded-xl shadow-lg shadow-indigo-600/25 transition-all duration-200 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
            <span id="submit-text">Sign in securely</span>
            <i id="submit-arrow" class="fa-solid fa-arrow-right text-xs"></i>
            <div id="submit-spinner" class="spinner w-4 h-4 hidden"></div>
          </button>
        </form>

        <!-- Divider -->
        <div class="relative my-6">
          <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-800"></div></div>
          <div class="relative flex justify-center text-xs uppercase"><span class="bg-slate-900 px-3 text-slate-500 font-medium">Or continue with</span></div>
        </div>

        <!-- Social Buttons -->
        <div class="grid grid-cols-2 gap-3">
          <button onclick="mockSocialAuth('Google')" class="flex items-center justify-center gap-2.5 py-2.5 px-4 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-xl text-xs font-semibold text-slate-300 transition-all">
            <i class="fa-brands fa-google text-slate-400"></i>
            <span>Google</span>
          </button>
          <button onclick="mockSocialAuth('GitHub')" class="flex items-center justify-center gap-2.5 py-2.5 px-4 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-xl text-xs font-semibold text-slate-300 transition-all">
            <i class="fa-brands fa-github text-slate-400"></i>
            <span>GitHub</span>
          </button>
        </div>

      </div>

      <!-- Footer Info -->
      <p class="text-center text-xs text-slate-500 mt-6">
        Protected by 256-bit SSL encryption. <br>
        &copy; 2026 NovaBank Global Inc. All rights reserved.
      </p>

    </div>
  </main>

  <!-- JavaScript Application Logic -->
  <script>
    // State Variables
    let authMode = 'login'; // 'login' or 'register'

    // DOM Helper
    const $ = id => document.getElementById(id);

    // Dynamic Auth Mode Toggle
    function setAuthMode(mode) {
      authMode = mode;
      
      const tabIndicator = $('tab-indicator');
      const btnLogin = $('btn-login');
      const btnRegister = $('btn-register');
      const nameField = $('name-field');
      const submitText = $('submit-text');
      const passwordInput = $('password');
      const forgotPassword = $('forgot-password');
      const rememberText = $('remember-text');

      // Clear any active alerts when switching tabs
      clearMessage();

      if (mode === 'register') {
        // Shift tab indicator
        tabIndicator.style.transform = 'translateX(100%)';
        btnLogin.classList.replace('text-white', 'text-slate-400');
        btnRegister.classList.replace('text-slate-400', 'text-white');

        // Show registration specific fields
        nameField.classList.remove('hidden');
        forgotPassword.classList.add('hidden');
        rememberText.textContent = 'I accept terms & conditions';

        // Update Button and Security Props
        submitText.textContent = 'Create account';
        passwordInput.autocomplete = 'new-password';
      } else {
        // Shift tab indicator back
        tabIndicator.style.transform = 'translateX(0%)';
        btnRegister.classList.replace('text-white', 'text-slate-400');
        btnLogin.classList.replace('text-slate-400', 'text-white');

        // Hide registration fields
        nameField.classList.add('hidden');
        forgotPassword.classList.remove('hidden');
        rememberText.textContent = 'Remember session';

        // Update Button and Security Props
        submitText.textContent = 'Sign in securely';
        passwordInput.autocomplete = 'current-password';
      }
    }

    // Toggle Password Visibility
    function togglePasswordVisibility() {
      const passwordInput = $('password');
      const icon = $('password-toggle-icon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    // Dynamic Alert Container Helper
    function setMessage(text, isSuccess = false) {
      const msgBox = $('auth-message');
      const msgText = $('auth-message-text');
      const msgIcon = $('auth-message-icon');

      if (!text) {
        clearMessage();
        return;
      }

      msgText.textContent = text;
      msgBox.classList.remove('hidden');

      if (isSuccess) {
        msgBox.className = 'mb-6 p-4 rounded-xl text-sm font-medium border flex items-start gap-3 bg-emerald-500/10 border-emerald-500/30 text-emerald-400';
        msgIcon.className = 'fa-solid fa-circle-check text-base mt-0.5 shrink-0 text-emerald-400';
      } else {
        msgBox.className = 'mb-6 p-4 rounded-xl text-sm font-medium border flex items-start gap-3 bg-rose-500/10 border-rose-500/30 text-rose-400';
        msgIcon.className = 'fa-solid fa-triangle-exclamation text-base mt-0.5 shrink-0 text-rose-400';
      }
    }

    function clearMessage() {
      const msgBox = $('auth-message');
      msgBox.classList.add('hidden');
    }

    // Handle Form Submission with Loading Simulation
    async function handleFormSubmit(event) {
      event.preventDefault();
      clearMessage();

      const email = $('email').value.trim();
      const password = $('password').value;
      const fullName = $('fullName').value.trim();

      // Basic Validation
      if (authMode === 'register' && !fullName) {
        setMessage('Please enter your full name.', false);
        return;
      }

      if (!email || !password) {
        setMessage('Please complete all required fields.', false);
        return;
      }

      if (password.length < 6) {
        setMessage('Password must be at least 6 characters long.', false);
        return;
      }

      // UI Loading State
      setLoading(true);

      // Simulate API Network Request
      setTimeout(() => {
        setLoading(false);

        if (email.includes('error')) {
          setMessage('Invalid email credentials or unauthorized account.', false);
        } else {
          if (authMode === 'login') {
            setMessage('Signed in successfully! Redirecting...', true);
          } else {
            setMessage('Account created! Welcome to NovaBank.', true);
          }
        }
      }, 1500);
    }

    // Set Button Loading State
    function setLoading(isLoading) {
      const submitBtn = $('auth-submit');
      const submitText = $('submit-text');
      const submitArrow = $('submit-arrow');
      const submitSpinner = $('submit-spinner');

      submitBtn.disabled = isLoading;

      if (isLoading) {
        submitText.textContent = authMode === 'login' ? 'Authenticating...' : 'Registering...';
        submitArrow.classList.add('hidden');
        submitSpinner.classList.remove('hidden');
      } else {
        submitText.textContent = authMode === 'login' ? 'Sign in securely' : 'Create account';
        submitArrow.classList.remove('hidden');
        submitSpinner.classList.add('hidden');
      }
    }

    // Mock Action Handlers
    function triggerForgotPassword(e) {
      e.preventDefault();
      const email = $('email').value.trim();
      if (!email) {
        setMessage('Please enter your email address to reset password.', false);
      } else {
        setMessage(`Password reset link sent to ${email}`, true);
      }
    }

    function mockSocialAuth(provider) {
      setMessage(`Initiating authentication via ${provider}...`, true);
    }
  </script>
</body>
</html>
