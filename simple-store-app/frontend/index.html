<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kwa-Mama --- The store that feels like hom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="stylesheet.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap">
</head>
<body>
    <header class="top">
        <a class="brand" href="/">Kwa-Mama</a>
        <input id="search" type="search" placeholder="Search products" aria-label="Search products">
        <button id="cartBtn" class="cart-btn">Cart (<span id="cartCounter">0</span>)</button>
    </header>

    <main>
        <h1>Okudla kwasekhaya (Food that feels like home)</h1>
        <div id="filters" class="filters"></div>
        <div id="grid" class="grid" aria-live="polite"></div>
    </main>

    <aside id="drawer" class="drawer" aria-hidden="true">
        <div class="drawer-head">
            <h2>Your cart</h2>
            <button id="closeCart" aria-label="Close cart">Close</button>
        </div>
        <ul id="cartItems" class="cart-items"></ul>
        <p class="total">Total <strong id="cartTotal">$0.00</strong></p>
        <form id="checkout" hidden>
            <input name="customerName" placeholder="Full name" required>
            <input name="email" type="email" placeholder="Email" required>
            <textarea name="address" placeholder="Delivery address" rows="2" required></textarea>
            <button class="primary" type="submit">Place order</button>
        </form>
        <button id="toCheckout" class="primary">Checkout</button>
        <p id="msg" class="msg" role="status"></p>   
    </aside>
    <div id="scrim" class="scrim" hidden></div>
    <script src="app.js"></script>
</body>
</html>
